name: Actualizar noticias ALVAPEN

on:
  schedule:
    - cron: "30 13 * * *" # Todos los días · 08:30 hora Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar noticias desde fuentes oficiales
        shell: python
        run: |
          import json, re, html, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          OUT = Path("data/noticias.json")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"ALVAPEN-News-Updater/1.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", "ignore")

          def clean(x):
              x = re.sub(r"<[^>]+>", " ", x or "")
              return re.sub(r"\s+", " ", html.unescape(x)).strip()

          def absurl(base, href):
              if href.startswith("http"): return href
              if href.startswith("//"): return "https:"+href
              return base.rstrip("/")+"/"+href.lstrip("/")

          previous = {}
          if OUT.exists():
              try:
                  previous=json.loads(OUT.read_text(encoding="utf-8"))
              except Exception:
                  previous={}

          sunat = []
          try:
              page=get("https://www.sunat.gob.pe/mensajes/mensajes-SUNAT.html")
              current_year=datetime.now(timezone.utc).year
              pattern=rf'(?is)(\d{{2}}/\d{{2}}/{current_year}).*?<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>'
              for m in re.finditer(pattern, page):
                  date,href,title=m.groups()
                  title=clean(title)
                  if title and title not in {x["title"] for x in sunat}:
                      sunat.append({
                          "title":title,
                          "summary":"Comunicado oficial de SUNAT. Revise el detalle en la fuente.",
                          "date":date,
                          "url":absurl("https://www.sunat.gob.pe",href)
                      })
                  if len(sunat)>=5: break
          except Exception:
              pass

          peru = []
          try:
              page=get("https://www.elperuano.pe/")
              for m in re.finditer(r'(?is)<a[^>]+href=["\']([^"\']*?/noticia/[^"\']+)["\'][^>]*>(.*?)</a>', page):
                  href,title=m.groups()
                  title=clean(title)
                  low=title.lower()
                  keywords=("sunat","tribut","impuesto","renta","igv","comprobante","mype","laboral","empleo","mtpe","mef","aduan","normas legales","feriado","detracc")
                  if title and any(k in low for k in keywords):
                      u=absurl("https://www.elperuano.pe",href)
                      if u not in [x["url"] for x in peru]:
                          peru.append({
                              "title":title,
                              "summary":"Novedad publicada por el Diario Oficial El Peruano. Revise la publicación para el detalle normativo.",
                              "date":datetime.now().strftime("%d/%m/%Y"),
                              "url":u
                          })
                  if len(peru)>=5: break
          except Exception:
              pass

          if not sunat and previous.get("sources"):
              sunat=next((x["items"] for x in previous["sources"] if x.get("name")=="SUNAT"),[])
          if not peru and previous.get("sources"):
              peru=next((x["items"] for x in previous["sources"] if x.get("name")=="EL PERUANO"),[])

          lima=timezone(timedelta(hours=-5))
          now=datetime.now(lima)
          data={
              "updated_at":now.isoformat(timespec="minutes"),
              "sources":[
                  {"name":"SUNAT","badge":"OFICIAL","url":"https://www.sunat.gob.pe/mensajes/mensajes-SUNAT.html","items":sunat[:5]},
                  {"name":"EL PERUANO","badge":"OFICIAL","url":"https://www.elperuano.pe/","items":peru[:5]}
              ]
          }
          OUT.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")

      - name: Publicar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "No hay cambios en las noticias."
          else
            git commit -m "Actualizar noticias diarias"
            git push
          fi
