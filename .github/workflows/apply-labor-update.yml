name: Apply ALVAPEN labor update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labor interface
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          nav_old = '''      <button type="button" class="trabajo-tab soon" disabled aria-disabled="true"><span class="trabajo-tab-icon">⛏️</span><span><strong>Sector minero</strong><small>Herramientas especializadas para el sector</small></span><b>PRÓXIMAMENTE</b></button>
    </div>
    <div class="alv-rmv-reference" role="note">'''
          nav_new = '''      <button type="button" class="trabajo-tab" onclick="document.getElementById('alv-laboral-actualizacion').scrollIntoView({behavior:'smooth',block:'start'})"><span class="trabajo-tab-icon">🏗️</span><span><strong>Construcción civil</strong><small>Jornales y beneficios colectivos 2026</small></span><b>VER</b></button>
      <button type="button" class="trabajo-tab soon" disabled aria-disabled="true"><span class="trabajo-tab-icon">⛏️</span><span><strong>Sector minero</strong><small>Herramientas especializadas para el sector</small></span><b>PRÓXIMAMENTE</b></button>
    </div>
    <div class="alv-rmv-reference" role="note">'''
          if 'Construcción civil' not in s:
              if nav_old not in s:
                  raise SystemExit("Navigation anchor not found")
              s = s.replace(nav_old, nav_new, 1)

          section_anchor = '''    <div class="trabajo-info-grid">
      <div class="trabajo-info"><span>01</span><div><strong>Rentas de trabajo</strong><p>Integra empleadores, rentas de cuarta, retenciones y deducciones en una sola proyección anual.</p></div></div>'''
          section = '''    <section id="alv-laboral-actualizacion" class="alv-laboral-update" aria-labelledby="alv-laboral-update-title">
      <div class="alv-laboral-update-head">
        <div>
          <span class="alv-laboral-kicker">ACTUALIZACIÓN LABORAL · OCTUBRE 2026</span>
          <h2 id="alv-laboral-update-title">RMV S/ 1,230: ¿qué cambia según el régimen?</h2>
          <p>El primer tramo del D.S. N.º 015-2026-TR rige desde el 01/10/2026. La RMV sube de S/ 1,130 a S/ 1,230. El segundo tramo hasta S/ 1,300 queda previsto para el primer semestre de 2027 mediante un nuevo Decreto Supremo.</p>
        </div>
        <div class="alv-rmv-pill"><strong>S/ 1,230.00</strong><span>RMV vigente</span></div>
      </div>
      <div class="alv-laboral-grid">
        <article class="alv-laboral-card">
          <div class="alv-laboral-card-icon">🏠</div>
          <div class="alv-laboral-card-tag">TRABAJADOR(A) DEL HOGAR</div>
          <h3>Régimen especial</h3>
          <ul>
            <li><b>RMV:</b> S/ 1,230 por 8 h diarias o 48 h semanales; por horas, proporcional.</li>
            <li><b>Asignación familiar:</b> S/ 123 si corresponde.</li>
            <li><b>Vacaciones:</b> 30 días calendario por año.</li>
            <li><b>Gratificaciones:</b> una remuneración mensual en julio y otra en diciembre.</li>
            <li><b>CTS:</b> depósito dentro de los primeros 15 días naturales de mayo y noviembre.</li>
            <li><b>Descanso semanal:</b> 24 horas continuas.</li>
          </ul>
          <small class="alv-source-note">Base: Ley N.º 31047 y orientación SUNAT.</small>
        </article>

        <article class="alv-laboral-card">
          <div class="alv-laboral-card-icon">🏢</div>
          <div class="alv-laboral-card-tag">EMPRESA · 3RA CATEGORÍA</div>
          <h3>Planilla del régimen privado</h3>
          <ul>
            <li><b>Piso remunerativo:</b> S/ 1,230 para jornada completa cuando resulte aplicable la RMV.</li>
            <li><b>Asignación familiar:</b> S/ 123 (10% de la RMV), cuando corresponda.</li>
            <li><b>Trabajo nocturno:</b> mínimo S/ 1,660.50.</li>
            <li><b>EsSalud:</b> aporte mínimo referencial de S/ 110.70 cuando la base mínima aplicable es la RMV.</li>
            <li><b>CTS, gratificaciones y vacaciones:</b> la subida de remuneraciones que toman como base el sueldo puede elevar sus importes.</li>
            <li><b>Importante:</b> quien ya gana más de S/ 1,230 no recibe automáticamente S/ 100 adicionales.</li>
          </ul>
          <small class="alv-source-note">La tercera categoría es tributaria; las obligaciones laborales dependen del régimen laboral aplicable al trabajador.</small>
        </article>

        <article class="alv-laboral-card alv-construccion-card">
          <div class="alv-laboral-card-icon">🏗️</div>
          <div class="alv-laboral-card-tag">CONSTRUCCIÓN CIVIL · 2026</div>
          <h3>Jornales convencionales</h3>
          <div class="alv-construction-table">
            <div><span>Operario</span><strong>S/ 89.30/día</strong></div>
            <div><span>Oficial</span><strong>S/ 69.75/día</strong></div>
            <div><span>Peón</span><strong>S/ 62.80/día</strong></div>
            <div><span>Movilidad</span><strong>S/ 8.60/día</strong></div>
          </div>
          <p class="alv-construction-note"><b>BUC:</b> 32% operario · 30% oficial · 30% peón.</p>
          <p class="alv-construction-note">Vigencia de estos jornales: 01/01/2026–31/12/2026. Construcción civil tiene una estructura remunerativa y de beneficios pactada colectivamente; no corresponde reemplazar automáticamente el jornal convencional por la RMV.</p>
          <small class="alv-source-note">Base: Acta Final de Negociación Colectiva Construcción Civil 2026 · R.M. N.º 197-2025-TR · tabla CAPECO/FTCCP.</small>
        </article>
      </div>
      <div class="alv-laboral-impact">
        <div><strong>📌 Parámetros vinculados a la RMV desde 01/10/2026</strong></div>
        <div class="alv-impact-items">
          <span>Asignación familiar <b>S/ 123.00</b></span>
          <span>Trabajo nocturno <b>S/ 1,660.50</b></span>
          <span>Mínimo minero <b>S/ 1,537.50</b></span>
          <span>Subvención formativa <b>S/ 1,230.00</b></span>
          <span>Prestaciones alimentarias <b>Hasta S/ 2,460.00</b></span>
          <span>BETA agrario <b>S/ 369.00</b></span>
        </div>
        <p>Estos parámetros deben tratarse como valores con vigencia y fuente normativa. ALVAPEN los separa de la interfaz para poder actualizarlos sin alterar las fórmulas de cada herramienta.</p>
      </div>
    </section>

    <div class="trabajo-info-grid">
      <div class="trabajo-info"><span>01</span><div><strong>Rentas de trabajo</strong><p>Integra empleadores, rentas de cuarta, retenciones y deducciones en una sola proyección anual.</p></div></div>'''
          if 'id="alv-laboral-actualizacion"' not in s:
              if section_anchor not in s:
                  raise SystemExit("Section anchor not found")
              s = s.replace(section_anchor, section, 1)

          if 'id="alvapen-laboral-rmv-v41"' not in s:
              marker = '/* ALVAPEN · Centro de Trabajo unificado */'
              css = '''/* ALVAPEN · Actualización laboral RMV 2026 */
          .alv-laboral-update{margin-top:18px;padding:24px;border:1px solid #d6e2ec;border-radius:22px;background:linear-gradient(145deg,#ffffff,#f7fafc);box-shadow:0 14px 34px rgba(16,42,67,.08);scroll-margin-top:18px}
          .alv-laboral-update-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid #e6edf3}
          .alv-laboral-kicker{font-size:10px;letter-spacing:.13em;font-weight:900;color:#1d638f}
          .alv-laboral-update h2{margin:6px 0 6px;color:#123b5c;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
          .alv-laboral-update-head p{margin:0;max-width:780px;color:#65778a;line-height:1.55;font-size:13px}
          .alv-rmv-pill{min-width:132px;padding:14px 16px;border-radius:16px;background:#123f62;color:#fff;text-align:center;box-shadow:0 8px 20px rgba(18,63,98,.16)}
          .alv-rmv-pill strong{display:block;font-size:21px}.alv-rmv-pill span{font-size:10px;color:#dbe8f2}
          .alv-laboral-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
          .alv-laboral-card{padding:18px;border:1px solid #dce6ee;border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(28,57,84,.05)}
          .alv-laboral-card-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#edf5fa;font-size:22px;margin-bottom:10px}
          .alv-laboral-card-tag{font-size:9px;font-weight:900;letter-spacing:.1em;color:#72869a}.alv-laboral-card h3{margin:5px 0 10px;color:#173f60;font-size:18px}
          .alv-laboral-card ul{margin:0;padding-left:18px;color:#53687b;font-size:12px;line-height:1.55}.alv-laboral-card li{margin:5px 0}.alv-laboral-card li b{color:#294e6c}
          .alv-source-note{display:block;margin-top:12px;color:#8291a0;font-size:9.5px;line-height:1.45}.alv-construccion-card{border-color:#e6d7b1;background:linear-gradient(145deg,#fff,#fffcf5)}
          .alv-construction-table{display:grid;gap:7px;margin:10px 0}.alv-construction-table div{display:flex;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:10px;background:#f6f7f8;font-size:11px;color:#53687b}.alv-construction-table strong{color:#173f60}
          .alv-construction-note{font-size:11px;color:#596d7f;line-height:1.5;margin:8px 0}.alv-laboral-impact{margin-top:14px;padding:15px 16px;border-radius:16px;background:#edf6fb;border:1px solid #cfe2ee;color:#274d68;font-size:12px}.alv-impact-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.alv-impact-items span{padding:8px 9px;border-radius:10px;background:#fff;border:1px solid #d9e8f1;font-size:10px;color:#5c7080}.alv-impact-items b{display:block;color:#173f60;margin-top:2px;font-size:11px}.alv-laboral-impact p{margin:8px 0 0;color:#60798b;font-size:10px;line-height:1.5}
          @media(max-width:900px){.alv-laboral-grid{grid-template-columns:1fr 1fr}.alv-impact-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:650px){.alv-laboral-update-head{align-items:flex-start;flex-direction:column}.alv-rmv-pill{width:100%}.alv-laboral-grid{grid-template-columns:1fr}.alv-impact-items{grid-template-columns:1fr}}
          '''
              if marker not in s:
                  raise SystemExit("CSS marker not found")
              s = s.replace(marker, css + marker, 1)

          p.write_text(s, encoding="utf-8")
          assert 'id="alv-laboral-actualizacion"' in s
          assert 'Construcción civil' in s
          assert 'S/ 89.30/día' in s
          assert 'S/ 1,660.50' in s
          print("Labor update applied", p.stat().st_size)

      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrar actualización laboral RMV y construcción 2026"
          git push
          rm -f .github/workflows/apply-labor-update.yml
          git add .github/workflows/apply-labor-update.yml
          git commit -m "Retirar workflow temporal de actualización laboral"
          git push
