name: Integrar carga Excel detracciones
on:
  push:
    branches: [main]
    paths:
      - 'assets/detracciones-excel.js'
      - '.github/workflows/integrar-carga-excel.yml'
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorganizar generador y carga masiva
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("No necesitas importar Excel.", "Puedes registrar operaciones manualmente o usar la carga masiva.")
          s = s.replace("<h2>3. Operaciones del lote</h2>", "<h2>4. Operaciones del lote</h2>")
          tag = '<script src="./assets/detracciones-excel.js?v=2"></script>'
          import re
          s = re.sub(r'<script src="\./assets/detracciones-excel\.js[^"]*"></script>\s*', '', s)
          pos = s.lower().rfind("</body>")
          if pos < 0:
              raise SystemExit("No se encontró el cierre body")
          s = s[:pos] + tag + "\n" + s[pos:]
          p.write_text(s, encoding="utf-8")
      - name: Guardar reorganización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reorganizar carga masiva de detracciones"
          git push